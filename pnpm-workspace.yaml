packages:
  - 'packages/*'

# pnpm 11: only these packages may run lifecycle scripts.
onlyBuiltDependencies:
  - esbuild
  - lefthook

# Result of `pnpm approve-builds` for those binaries.
allowBuilds:
  esbuild: true
  lefthook: true

minimumReleaseAgeExclude:
  - '@hochgi/test-kit-mock@2.0.2'
  - '@hochgi/test-kit-s3@2.0.3'
  - '@hochgi/test-kit@2.0.5'
